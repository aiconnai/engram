# Governance Model Registry
# Enforces [R-8.3.3] of the Rust Repository Engineering Standard v5 and RFC 0011.
#
# Schema requirements for each [[model]] entry:
#   provider             - Approved provider ID (e.g. "openai", "gemini", "ollama", "local")
#   model_id             - Precise model identifier string
#   purpose              - Primary purpose (e.g. "embedding_text", "rerank", "vision", "council")
#   capability_class     - "remote_api", "local_deterministic", "local_neural"
#   offline_capable      - Boolean flag indicating whether offline execution is supported
#   fallback_eligible    - Boolean flag indicating whether this model may be used as a fallback
#   fallback_target      - Target provider/model if degraded (or empty if final terminal)

[[model]]
provider = "tfidf"
model_id = "tfidf-128"
purpose = "embedding_text"
capability_class = "local_deterministic"
offline_capable = true
fallback_eligible = true
fallback_target = ""

