# Governance Exceptions Manifest
# Enforces [R-0.6] of the Rust Repository Engineering Standard v5.
#
# Schema requirements for each [[exception]] entry:
#   id                   - Unique identifier (e.g. "EXC-0001")
#   rule                 - Mapped rule ID (e.g. "R-2.1.3" or "P-A.2.1")
#   owner                - Accountable individual or team handle
#   rationale            - Clear business/technical explanation for the waiver
#   scope                - Specific crate, path, or module where waiver applies
#   compensating_control - Safeguards in effect while waiver is active
#   record               - Linked ADR, RFC, or issue ID
#   expires              - Expiration date in YYYY-MM-DD format (must be unexpired)

# No active exceptions.
#
# EXC-0001 (rule P-A.2.1, dual reqwest 0.12 and 0.13) was removed on 2026-10-05 (task INT):
# it had no subject. Cargo.lock resolves only reqwest 0.12.28 in every feature graph, and neither
# Cargo.toml nor deny.toml cited the id as P-A.2.1 requires. A future dual-reqwest waiver needs a
# new record that references R-2.1.3 and is cited by the responsible Cargo.toml / cargo-deny skip.
#
# RustSec advisory exceptions are governed separately in docs/security/advisory-exceptions.toml
# (parity with .cargo/audit.toml and deny.toml is enforced by scripts/check-security-exceptions.py).
