name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"

# Least privilege by default. Publication to code scanning needs security-events: write, which
# is granted only to the `publish` job and never on pull_request events.
permissions:
  contents: read

jobs:
  # Read-only measurement: runs on every event, never uploads to GitHub code scanning.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: error
          retention-days: 30

  # Trusted publication: only push/schedule events reach this job. The aggregate Security Gate
  # in ci.yml judges pull requests (codeql-security + findings policy).
  publish:
    name: Publish SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]

    steps:
      - name: Download SARIF produced by the read-only analysis
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
