name: AgentShield Loop

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Bounded loop iteration cap"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: agentshield-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: AgentShield Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: agentshield-loop-v0.8.7

      - name: Install AgentShield
        # Pinned by commit SHA, not a mutable ref. SHA is the peeled commit of
        # annotated tag v0.8.7 (resolved 2026-06-27 via
        # `git ls-remote 'refs/tags/v0.8.7^{}'`). Re-resolve and update this SHA
        # when bumping AgentShield; do NOT switch back to a tag ref (tags can be
        # moved upstream, defeating supply-chain pinning).
        run: |
          cargo install \
            --git https://github.com/limaronaldo/agentshield \
            --rev a1a571197211793422d31811be3d7735dae0a30a \
            --features full \
            --locked \
            --force

      - name: Run bounded AgentShield loop
        env:
          LOOP_MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '1' }}
          LOOP_STATE_WRITE: "1"
        run: bash scripts/run-agentshield-loop.sh

      - name: Upload loop state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentshield-loop-state
          path: docs/loops/agentshield-scan/STATE.md
