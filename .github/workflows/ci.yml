name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the (heavy) build/test pipeline.
    paths-ignore:
      - '**.md'
      - '.air/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # Branch protection requires the required contexts on every PR. Do not
    # path-filter PR events, or docs-only PRs can wait forever for checks that
    # GitHub expected but this workflow never reported.
  workflow_dispatch:
  schedule:
    # Extended / expensive checks run on a schedule so normal PRs stay cheap
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

# Superseded runs for the same workflow/event/ref are cancelled automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN. Jobs that need more opt in with
# their own job-level `permissions:` block below.
permissions:
  contents: read

# =============================================================================
# CI Policy (as of 2026-05)
#
# Required to be green on every PR:
#   - fmt
#   - clippy
#   - test (ubuntu-latest only)
#   - docs (includes ./scripts/generate-mcp-reference.sh --check)
#
# These four branch-protection contexts protect main. `Test (ubuntu-latest)`
# also depends transitively on the PR-visible `Security Gate`, which aggregates
# the supply-chain and security scans below. Contributors should run `make ci`
# or `just ci` locally before pushing.
#
# Property tests, golden tests, full-feature Clippy, backend smoke, benchmarks,
# and release builds remain extended. They run on the nightly schedule, manual
# dispatch, and (where configured below) direct pushes to `main`; they do not
# block pull requests. Security and supply-chain jobs are the exception: they
# run on pull requests and feed the required aggregate gate.
#
# The heaviest long-tail jobs (`Full Feature Tests` which compiles
# `--all-features` single-threaded, `Test (macos-latest)`, and `Coverage`) are
# trimmed even further — schedule + manual dispatch only, NOT on push to `main`
# — so normal `main` pushes never wait on them. Use `workflow_dispatch` to run
# them on demand. In all cases the required jobs above plus the transitive
# Security Gate are the gate; do not wait on unrelated extended jobs before
# considering a `main` push landed.
#
# This keeps GitHub Actions as an enforceable gate without incurring high
# per-PR costs (especially macOS minutes and long-running jobs).
#
# To change what is "required", update branch protection rules on GitHub
# to only mark the four jobs above as required.
# =============================================================================

jobs:
  # =============================================================================
  # Required on every PR (must stay fast and cheap)
  # =============================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          components: clippy
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: required-linux
      - run: |
          source scripts/ci-required-features.env
          cargo clippy --all-targets --no-default-features --features "$CI_REQUIRED_FEATURES" -- -D warnings

  # Required on every PR (Ubuntu only — fast, cheap, deterministic)
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, security-gate]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          targets: wasm32-unknown-unknown
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: required-linux
      - name: Run hot-path benchmarks for this PR
        run: |
          source scripts/ci-required-features.env
          cargo bench --bench entity_extraction --no-default-features --features "$CI_REQUIRED_FEATURES" | tee benches/results/pr-benchmark-results.txt
      - name: Enforce retrieval and performance budgets
        run: >-
          python3 scripts/check-quality-budgets.py
          --budgets docs/quality/budgets.json
          --retrieval tests/fixtures/retrieval_quality/baseline.json
          --criterion benches/results/pr-benchmark-results.txt
      - name: Test library and integration tests
        run: |
          source scripts/ci-required-features.env
          export CARGO_BUILD_JOBS=1

          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --lib --tests -- --test-threads=1

      - name: Test binary unit tests
        run: |
          source scripts/ci-required-features.env
          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --bin engram-server
          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --bin engram-watcher
      - name: Check WASM crate
        run: |
          cargo check -p engram-wasm --all-targets
          cargo check -p engram-wasm --target wasm32-unknown-unknown

  # Extended / expensive macOS testing. Only runs on schedule + manual trigger.
  # Not required for PR merge (avoids high macOS minute costs).
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: macOS smoke test
        run: |
          source scripts/ci-features.env
          cargo test --features "$CI_FEATURES" --lib -- --test-threads=1 || true

  # =============================================================================
  # Extended checks (run on schedule + manual dispatch, not required for PRs)
  # These are valuable but expensive or non-deterministic.
  # =============================================================================

  # Property tests (critical for vector store + parsers)
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --test property_tests -- --test-threads=1
        env:
          PROPTEST_CASES: 500

  # Golden tests (prevent output drift)
  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --test golden_tests

  full-feature-clippy:
    name: Full Feature Clippy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          components: clippy
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: extended-linux
      - run: cargo clippy --all-targets --all-features -- -D warnings

  full-feature-tests:
    name: Full Feature Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: extended-linux
      - run: |
          export CARGO_BUILD_JOBS=1
          cargo test --profile ci --all-features --lib --tests -- --test-threads=1

  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: extended-linux
      - name: Test local embedding backend
        run: cargo test --profile ci --no-default-features --features local-embeddings --lib embedding::onnx
      - name: Test neural rerank backend
        run: cargo test --profile ci --no-default-features --features neural-rerank --lib search::neural_rerank

  # =============================================================================
  # Security & Supply Chain
  # =============================================================================

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Runs on PRs and feeds the aggregate Security Gate. The live branch
    # protection context may also require this job directly.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    # Runs on PRs and feeds the aggregate Security Gate. The live branch
    # protection context may also require this job directly.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check advisories bans licenses sources

  security-exceptions:
    name: Security exception policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate governed advisory exceptions
        run: python3 scripts/check-security-exceptions.py --config docs/security/advisory-exceptions.toml --audit-config .cargo/audit.toml --deny-config deny.toml

  codeql-security:
    name: CodeQL security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          languages: rust
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          category: /language:rust

  semgrep-security:
    name: Semgrep security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.169.0 \
            semgrep --config p/ci --error /src

  gitleaks-security:
    name: Secret scan security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:v8.23.3 \
            detect --source /src --no-git --verbose --redact --exit-code 1

  agentshield-security:
    name: AgentShield security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: aiconnai/agentshield@663cf4bf3c7a633c5caad398105264eb8680679d # v0.8.7
        with:
          path: .
          fail-on: high
          ignore-tests: true
          format: sarif
          upload-sarif: false
          version: v0.8.7

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - audit
      - deny
      - security-exceptions
      - codeql-security
      - semgrep-security
      - gitleaks-security
      - agentshield-security
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Require every security constituent
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/check-security-gate.py
          --matrix tests/fixtures/security_gate_matrix.json
          --workflow .github/workflows/ci.yml
          --results-json "$RESULTS_JSON"
          --event "${{ github.event_name }}"

  # =============================================================================
  # Coverage (with threshold)
  # =============================================================================

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          components: llvm-tools-preview
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-targets: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-llvm-cov

      - name: Generate coverage
        run: |
          source scripts/ci-features.env
          export CARGO_BUILD_JOBS=1

          cargo llvm-cov clean --workspace

          cargo llvm-cov --features "$CI_FEATURES" --no-report --lib
          cargo llvm-cov --features "$CI_FEATURES" --no-report --tests

          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Check coverage threshold
        # Threshold reflects current repo reality (~60% with CI feature set).
        # Features like sync/cloud, meilisearch_indexer, temporal-graph have
        # 0% coverage because they require external services or unfinished
        # implementations to test. Raise this incrementally as new tests land.
        run: |
          cargo llvm-cov report --fail-under-lines 55

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Benchmarks (quick on PR, full on main)
  # =============================================================================

  bench-check:
    name: Bench Compile Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo bench --no-run

  bench:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Run benchmarks (Criterion bencher output)
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            cargo bench --bench entity_extraction -- --output-format bencher
          else
            cargo bench -- --output-format bencher
          fi | tee bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        # Tolerate missing gh-pages branch on first run / forks. The raw
        # criterion artifacts still upload via the next step, so PR authors
        # can inspect benchmark output even before history is established.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        with:
          name: Engram Performance
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # On main: update baseline and publish to gh-pages
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # On PRs: compare against baseline and comment
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          # Fail if any benchmark regresses by more than 15%
          alert-threshold: "115%"
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
          # Store history in gh-pages branch
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

      - name: Upload raw Criterion reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: target/criterion/

  # =============================================================================
  # Documentation
  # =============================================================================

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: required-linux
      - run: ./scripts/generate-mcp-reference.sh --check
      - run: python3 scripts/test_check_pdf_worker_packaging.py
      - run: python3 scripts/check-pdf-worker-packaging.py
      - run: |
          source scripts/ci-required-features.env
          cargo doc --no-default-features --features "$CI_REQUIRED_FEATURES" --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # =============================================================================
  # Release builds
  # =============================================================================

  release:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-12
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features pdf --bin engram-server --bin engram-cli --bin engram-pdf-worker

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engram-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/engram-server
            target/${{ matrix.target }}/release/engram-cli
      - name: Upload PDF worker artifact
        if: contains(matrix.target, '-linux-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engram-pdf-worker-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/engram-pdf-worker
