name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the (heavy) build/test pipeline.
    paths-ignore:
      - '**.md'
      - '.air/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.air/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    # Extended / expensive checks run on a schedule so normal PRs stay cheap
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

# Superseded runs for the same workflow/event/ref are cancelled automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN. Jobs that need more opt in with
# their own job-level `permissions:` block below.
permissions:
  contents: read

# =============================================================================
# CI Policy (as of 2026-05)
#
# Required to be green on every PR (cheap + deterministic):
#   - fmt
#   - clippy
#   - test (ubuntu-latest only)
#   - docs (includes ./scripts/generate-mcp-reference.sh --check)
#
# These four jobs protect main. Contributors should run `make ci` or `just ci`
# locally before pushing.
#
# Everything else (property-tests, golden-tests, full-feature clippy, backend
# smoke, benchmarks, cargo-deny, security-audit, release builds) is "extended".
# It runs on the nightly schedule, on manual dispatch, AND on every direct push
# to `main` as a post-merge safety net. It does NOT run on PRs, and it does NOT
# block: a push to `main` is already merged, so a red extended job is a signal
# to investigate, not a gate that holds anything back.
#
# The heaviest long-tail jobs (`Full Feature Tests` which compiles
# `--all-features` single-threaded, `Test (macos-latest)`, and `Coverage`) are
# trimmed even further — schedule + manual dispatch only, NOT on push to `main`
# — so normal `main` pushes never wait on them. Use `workflow_dispatch` to run
# them on demand. In all cases the four required jobs above are the gate; do not
# wait on any extended job before considering a `main` push landed.
#
# This keeps GitHub Actions as an enforceable gate without incurring high
# per-PR costs (especially macOS minutes and long-running jobs).
#
# To change what is "required", update branch protection rules on GitHub
# to only mark the four jobs above as required.
# =============================================================================

jobs:
  # =============================================================================
  # Required on every PR (must stay fast and cheap)
  # =============================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: required-linux
      - run: |
          source scripts/ci-required-features.env
          cargo clippy --all-targets --no-default-features --features "$CI_REQUIRED_FEATURES" -- -D warnings

  # Required on every PR (Ubuntu only — fast, cheap, deterministic)
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: required-linux
      - name: Test library and integration tests
        run: |
          source scripts/ci-required-features.env
          export CARGO_BUILD_JOBS=1

          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --lib --tests -- --test-threads=1

      - name: Test binary unit tests
        run: |
          source scripts/ci-required-features.env
          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --bin engram-server
          cargo test --profile ci --no-default-features --features "$CI_REQUIRED_FEATURES" --bin engram-watcher

  # Extended / expensive macOS testing. Only runs on schedule + manual trigger.
  # Not required for PR merge (avoids high macOS minute costs).
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: macOS smoke test
        run: |
          source scripts/ci-features.env
          cargo test --features "$CI_FEATURES" --lib -- --test-threads=1 || true

  # =============================================================================
  # Extended checks (run on schedule + manual dispatch, not required for PRs)
  # These are valuable but expensive or non-deterministic.
  # =============================================================================

  # Property tests (critical for vector store + parsers)
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test property_tests -- --test-threads=1
        env:
          PROPTEST_CASES: 500

  # Golden tests (prevent output drift)
  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test golden_tests

  full-feature-clippy:
    name: Full Feature Clippy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: extended-linux
      - run: cargo clippy --all-targets --all-features -- -D warnings

  full-feature-tests:
    name: Full Feature Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: extended-linux
      - run: |
          export CARGO_BUILD_JOBS=1
          cargo test --profile ci --all-features --lib --tests -- --test-threads=1

  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: extended-linux
      - name: Test local embedding backend
        run: cargo test --profile ci --no-default-features --features local-embeddings --lib embedding::onnx
      - name: Test neural rerank backend
        run: cargo test --profile ci --no-default-features --features neural-rerank --lib search::neural_rerank

  # =============================================================================
  # Security & Supply Chain
  # =============================================================================

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # =============================================================================
  # Coverage (with threshold)
  # =============================================================================

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          source scripts/ci-features.env
          export CARGO_BUILD_JOBS=1

          cargo llvm-cov clean --workspace

          cargo llvm-cov --features "$CI_FEATURES" --no-report --lib
          cargo llvm-cov --features "$CI_FEATURES" --no-report --tests

          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Check coverage threshold
        # Threshold reflects current repo reality (~60% with CI feature set).
        # Features like sync/cloud, meilisearch_indexer, temporal-graph have
        # 0% coverage because they require external services or unfinished
        # implementations to test. Raise this incrementally as new tests land.
        run: |
          cargo llvm-cov report --fail-under-lines 55

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Benchmarks (quick on PR, full on main)
  # =============================================================================

  bench-check:
    name: Bench Compile Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  bench:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (Criterion JSON output)
        run: cargo bench -- --output-format bencher | tee bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        # Tolerate missing gh-pages branch on first run / forks. The raw
        # criterion artifacts still upload via the next step, so PR authors
        # can inspect benchmark output even before history is established.
        continue-on-error: true
        with:
          name: Engram Performance
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # On main: update baseline and publish to gh-pages
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # On PRs: compare against baseline and comment
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          # Fail if any benchmark regresses by more than 15%
          alert-threshold: "115%"
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
          # Store history in gh-pages branch
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

      - name: Upload raw Criterion reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: target/criterion/

  # =============================================================================
  # Documentation
  # =============================================================================

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "No supported package manager found for protoc" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: required-linux
      - run: ./scripts/generate-mcp-reference.sh --check
      - run: |
          source scripts/ci-required-features.env
          cargo doc --no-default-features --features "$CI_REQUIRED_FEATURES" --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # =============================================================================
  # Release builds
  # =============================================================================

  release:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: engram-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/engram-server
            target/${{ matrix.target }}/release/engram-cli
