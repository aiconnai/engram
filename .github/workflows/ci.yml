name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Extended / expensive checks run on a schedule so normal PRs stay cheap
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# =============================================================================
# CI Policy (as of 2026-05)
#
# Required to be green on every PR (cheap + deterministic):
#   - fmt
#   - clippy
#   - test (ubuntu-latest only)
#   - docs (includes ./scripts/generate-mcp-reference.sh --check)
#
# These four jobs protect main. Contributors should run `make ci` or `just ci`
# locally before pushing.
#
# Everything else (macOS, property-tests, golden-tests, coverage, benchmarks,
# cargo-deny, security-audit) is "extended". It runs on schedule and on
# manual dispatch. It does NOT block PRs by default.
#
# This keeps GitHub Actions as an enforceable gate without incurring high
# per-PR costs (especially macOS minutes and long-running jobs).
#
# To change what is "required", update branch protection rules on GitHub
# to only mark the four jobs above as required.
# =============================================================================

jobs:
  # =============================================================================
  # Required on every PR (must stay fast and cheap)
  # =============================================================================

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Required on every PR (Ubuntu only — fast, cheap, deterministic)
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Test library and integration tests
        run: |
          source scripts/ci-features.env
          export CARGO_BUILD_JOBS=1

          cargo test --features "$CI_FEATURES" --lib -- --test-threads=1

          for test_file in tests/*.rs; do
            test_name="$(basename "$test_file" .rs)"
            cargo test --features "$CI_FEATURES" --test "$test_name" -- --test-threads=1
          done

      - name: Test local embedding backend
        run: |
          source scripts/ci-features.env
          cargo test --features local-embeddings --lib embedding::onnx

      - name: Test neural rerank backend
        run: |
          source scripts/ci-features.env
          cargo test --features neural-rerank --lib search::neural_rerank

      - name: Test binary unit tests
        run: |
          source scripts/ci-features.env
          cargo test --bin engram-server
          cargo test --features watcher --bin engram-watcher

  # Extended / expensive macOS testing. Only runs on schedule + manual trigger.
  # Not required for PR merge (avoids high macOS minute costs).
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: macOS smoke test
        run: |
          source scripts/ci-features.env
          cargo test --features "$CI_FEATURES" --lib -- --test-threads=1 || true

  # =============================================================================
  # Extended checks (run on schedule + manual dispatch, not required for PRs)
  # These are valuable but expensive or non-deterministic.
  # =============================================================================

  # Property tests (critical for vector store + parsers)
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test property_tests -- --test-threads=1
        env:
          PROPTEST_CASES: 500

  # Golden tests (prevent output drift)
  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test golden_tests

  # =============================================================================
  # Security & Supply Chain
  # =============================================================================

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # =============================================================================
  # Coverage (with threshold)
  # =============================================================================

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Free Linux runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          source scripts/ci-features.env
          export CARGO_BUILD_JOBS=1

          cargo llvm-cov clean --workspace

          cargo llvm-cov --features "$CI_FEATURES" --no-report --lib

          for test_file in tests/*.rs; do
            test_name="$(basename "$test_file" .rs)"
            cargo llvm-cov --features "$CI_FEATURES" --no-report --test "$test_name"
          done

          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Check coverage threshold
        # Threshold reflects current repo reality (~60% with CI feature set).
        # Features like sync/cloud, meilisearch_indexer, temporal-graph have
        # 0% coverage because they require external services or unfinished
        # implementations to test. Raise this incrementally as new tests land.
        run: |
          cargo llvm-cov report --fail-under-lines 55

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Benchmarks (quick on PR, full on main)
  # =============================================================================

  bench-check:
    name: Bench Compile Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  bench:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (Criterion JSON output)
        run: cargo bench -- --output-format bencher | tee bench-output.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        # Tolerate missing gh-pages branch on first run / forks. The raw
        # criterion artifacts still upload via the next step, so PR authors
        # can inspect benchmark output even before history is established.
        continue-on-error: true
        with:
          name: Engram Performance
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # On main: update baseline and publish to gh-pages
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # On PRs: compare against baseline and comment
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          # Fail if any benchmark regresses by more than 15%
          alert-threshold: "115%"
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
          # Store history in gh-pages branch
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

      - name: Upload raw Criterion reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: target/criterion/

  # =============================================================================
  # Documentation
  # =============================================================================

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/generate-mcp-reference.sh --check
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # =============================================================================
  # Release builds
  # =============================================================================

  release:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engram-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/engram-server
            target/${{ matrix.target }}/release/engram-cli
