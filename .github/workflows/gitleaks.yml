name: Gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege by default. Publication needs security-events: write, which is granted only to
# the `publish` job and never on pull_request events.
permissions:
  contents: read

jobs:
  # Read-only measurement: runs on every event, retains the SARIF, never uploads it.
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:v8.23.3@sha256:8e03b497df3d3080d61f5f13c1ea67c331b5e4c4c475256f67fb3dddcd9e895d \
            detect \
              --source /src \
              --no-git \
              --verbose \
              --redact \
              --report-format sarif \
              --report-path /src/gitleaks.sarif \
              --exit-code 1

      - name: Retain SARIF result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: error
          retention-days: 30

  # Trusted publication: only push events reach this job.
  publish:
    name: Secret scan SARIF publish
    runs-on: ubuntu-latest
    needs: scan
    # always(): publish findings even when the scan step failed on leaks (--exit-code 1).
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF produced by the read-only scan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gitleaks-sarif
          path: sarif-results

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: sarif-results/gitleaks.sarif
          category: gitleaks
