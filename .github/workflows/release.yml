name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.6.1)"
        required: true
        type: string
      overwrite_assets:
        description: "Allow replacing assets when the GitHub Release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version"
            exit 1
          fi

      - name: Check release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE_ASSETS: ${{ github.event.inputs.overwrite_assets || 'false' }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(
            curl -sS \
              -o "${response_file}" \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}"
          )"

          if [ "${status_code}" = "200" ]; then
            if [ "${OVERWRITE_ASSETS}" = "true" ]; then
              echo "::warning::Release ${RELEASE_VERSION} already exists; overwrite_assets=true allows asset replacement."
            else
              echo "::error::Release ${RELEASE_VERSION} already exists. Re-run with overwrite_assets=true only if replacing release assets and Homebrew checksums is intentional."
              exit 1
            fi
          elif [ "${status_code}" = "404" ]; then
            echo "Release ${RELEASE_VERSION} does not exist; continuing."
          else
            echo "::error::Could not verify release ${RELEASE_VERSION}; GitHub API returned HTTP ${status_code}."
            cat "${response_file}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --features pdf --bin engram-server --bin engram-cli --bin engram-pdf-worker

      - name: Package (Unix)
        run: |
          ARCHIVE="engram-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *-linux-* ]]; then
            tar -czf "../../../${ARCHIVE}" engram-server engram-cli engram-pdf-worker
          else
            tar -czf "../../../${ARCHIVE}" engram-server engram-cli
          fi
          cd ../../..
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: |
            engram-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
            engram-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          echo "## SHA256 Checksums" > release/CHECKSUMS.md
          echo '```' >> release/CHECKSUMS.md
          cat release/*.sha256 >> release/CHECKSUMS.md
          echo '```' >> release/CHECKSUMS.md
          cat release/CHECKSUMS.md
          .github/scripts/extract-release-notes.sh "${RELEASE_VERSION}" CHANGELOG.md release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          draft: false
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.tar.gz
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check Homebrew token
        id: homebrew-token
        run: |
          if [ -n "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew formula update."
          fi

      - name: Download SHA256 files
        if: steps.homebrew-token.outputs.available == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Checkout Engram release source
        if: steps.homebrew-token.outputs.available == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: engram-source
          ref: ${{ env.RELEASE_VERSION }}

      - name: Checkout homebrew-engram
        if: steps.homebrew-token.outputs.available == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: aiconnai/homebrew-engram
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-engram

      - name: Update formula
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          REF="$RELEASE_VERSION"
          VERSION="${REF#v}"

          # Read SHA256 hashes
          ARM64_MAC=$(cat artifacts/aarch64-apple-darwin/*.sha256 | awk '{print $1}')
          X86_64_MAC=$(cat artifacts/x86_64-apple-darwin/*.sha256 | awk '{print $1}')
          ARM64_LINUX=$(cat artifacts/aarch64-unknown-linux-gnu/*.sha256 | awk '{print $1}')
          X86_64_LINUX=$(cat artifacts/x86_64-unknown-linux-gnu/*.sha256 | awk '{print $1}')

          cd homebrew-engram

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/engram.rb

          # Update SHA256 hashes (replace any existing hash or placeholder)
          # macOS arm64
          sed -i "/aarch64-apple-darwin/{ n; s/sha256 \".*\"/sha256 \"${ARM64_MAC}\"/ }" Formula/engram.rb
          # macOS x86_64
          sed -i "/x86_64-apple-darwin/{ n; s/sha256 \".*\"/sha256 \"${X86_64_MAC}\"/ }" Formula/engram.rb
          # Linux arm64
          sed -i "/aarch64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${ARM64_LINUX}\"/ }" Formula/engram.rb
          # Linux x86_64
          sed -i "/x86_64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${X86_64_LINUX}\"/ }" Formula/engram.rb

          python3 ../engram-source/.github/scripts/ensure-pdf-worker-homebrew.py Formula/engram.rb
          if grep -F 'bin.install "engram-pdf-worker"' Formula/engram.rb >/dev/null; then
            echo "macOS formula must not install unsupported PDF worker" >&2
            exit 1
          fi

          echo "Updated formula:"
          cat Formula/engram.rb

      - name: Commit and push
        if: steps.homebrew-token.outputs.available == 'true'
        run: |
          REF="$RELEASE_VERSION"
          cd homebrew-engram
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/engram.rb
          if git diff --cached --quiet; then
            echo "No Homebrew formula changes"
            exit 0
          fi
          git commit -m "chore: update engram to ${REF}"
          git push
