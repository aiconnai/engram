name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and attest the complete matrix without publishing"
        required: true
        default: true
        type: boolean
      sha:
        description: "Exact commit SHA that this run must build"
        required: true
        type: string
      version:
        description: "Artifact version label (for example v0.22.0)"
        required: false
        default: "v0.22.0"
        type: string
      overwrite_assets:
        description: "Allow replacing assets on an existing GitHub Release"
        required: false
        default: false
        type: boolean
      homebrew_only:
        description: "Update Homebrew from an already verified GitHub Release"
        required: false
        default: false
        type: boolean
      tag:
        description: "Exact protected release tag for a Homebrew-only run"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.guard.outputs.dry_run }}
      homebrew_only: ${{ steps.guard.outputs.homebrew_only }}
      release_version: ${{ steps.guard.outputs.release_version }}
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Validate event, ref, and SHA before any write
        id: guard
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          INPUT_SHA: ${{ github.event.inputs.sha || github.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          INPUT_HOMEBREW_ONLY: ${{ github.event.inputs.homebrew_only || 'false' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          INPUT_OVERWRITE: ${{ github.event.inputs.overwrite_assets || 'false' }}
        run: |
          set -euo pipefail

          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "${INPUT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::supplied SHA does not match github.sha"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${INPUT_SHA}" ]]; then
            echo "::error::checked-out commit does not match supplied SHA"
            exit 1
          fi
          if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be an exact stable semver tag"
            exit 1
          fi

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            if [[ "${INPUT_HOMEBREW_ONLY}" == "true" || "${INPUT_OVERWRITE}" == "true" ]]; then
              echo "::error::dry-run cannot request a write mode"
              exit 1
            fi
          else
            if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${INPUT_VERSION}" ]]; then
              echo "::error::live release requires the exact version tag ref"
              exit 1
            fi
            if [[ "$(git rev-list -n 1 "${INPUT_VERSION}^{commit}")" != "${INPUT_SHA}" ]]; then
              echo "::error::tag, github.sha, and supplied SHA do not agree"
              exit 1
            fi
          fi

          if [[ "${INPUT_HOMEBREW_ONLY}" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || "${INPUT_TAG}" != "${INPUT_VERSION}" ]]; then
              echo "::error::Homebrew writes require an explicit exact-tag dispatch"
              exit 1
            fi
          elif [[ -n "${INPUT_TAG}" ]]; then
            echo "::error::tag input is valid only for homebrew_only"
            exit 1
          fi

          {
            echo "dry_run=${INPUT_DRY_RUN}"
            echo "homebrew_only=${INPUT_HOMEBREW_ONLY}"
            echo "release_version=${INPUT_VERSION}"
            echo "release_sha=${INPUT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check GitHub Release immutability
        if: steps.guard.outputs.dry_run == 'false' && steps.guard.outputs.homebrew_only == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE_ASSETS: ${{ github.event.inputs.overwrite_assets || 'false' }}
          RELEASE_VERSION: ${{ steps.guard.outputs.release_version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${OVERWRITE_ASSETS}" != "true" ]]; then
              echo "::error::release already exists; overwrite was not explicitly approved"
              exit 1
            fi
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.homebrew_only == 'false'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} --features pdf --bin engram-server --bin engram-cli --bin engram-pdf-worker

      - name: Package deterministic archive and supply-chain evidence
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          scripts/verify-release-artifacts.sh \
            --create-bundle \
            --binary-dir "target/${RELEASE_TARGET}/release" \
            --output-dir release-bundle \
            --target "${RELEASE_TARGET}" \
            --version "${RELEASE_VERSION}" \
            --sha "${RELEASE_SHA}" \
            --ref "${RELEASE_REF}"
          scripts/verify-release-artifacts.sh \
            --artifact-dir release-bundle \
            --expected-sha "${RELEASE_SHA}" \
            --target "${RELEASE_TARGET}" \
            --allow-untrusted-local
          scripts/test-release-binary.sh \
            --artifact-dir release-bundle \
            --target "${RELEASE_TARGET}" \
            --allow-cross

      - name: Sign bundle with GitHub Actions identity
        id: github-attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-bundle/*
          show-summary: false

      - name: Bind and verify GitHub identity attestation
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
          GITHUB_ATTESTATION_BUNDLE: ${{ steps.github-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive="release-bundle/engram-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          cp "${GITHUB_ATTESTATION_BUNDLE}" "${archive}.github-attestation.sigstore.json"
          scripts/verify-release-artifacts.sh \
            --artifact-dir release-bundle \
            --expected-sha "${RELEASE_SHA}" \
            --target "${RELEASE_TARGET}"

      - name: Upload attested artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-${{ matrix.target }}
          if-no-files-found: error
          path: release-bundle/

  dry-run-summary:
    name: Verify dry-run matrix
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: core-*
          path: artifacts
      - name: Verify exact matrix, checksums, SBOMs, signature, and provenance
        run: scripts/verify-release-artifacts.sh --artifact-dir artifacts --expected-sha "${{ needs.preflight.outputs.release_sha }}"
      - name: Assert dry-run cannot publish
        run: |
          test "${{ needs.preflight.outputs.dry_run }}" = true
          test "${{ needs.preflight.outputs.homebrew_only }}" = false
          echo "Dry-run complete: no tag, GitHub Release, registry, or Homebrew write was attempted."

  release:
    name: Create GitHub Release
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'false' && needs.preflight.outputs.homebrew_only == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release-github
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: core-*
          path: artifacts
      - name: Verify all release inputs before publication
        run: scripts/verify-release-artifacts.sh --artifact-dir artifacts --expected-sha "${{ needs.preflight.outputs.release_sha }}"
      - name: Collect release files
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          .github/scripts/extract-release-notes.sh "${RELEASE_VERSION}" CHANGELOG.md release/RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_version }}
          draft: false
          body_path: release/RELEASE_NOTES.md
          overwrite_files: ${{ github.event.inputs.overwrite_assets || false }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: preflight
    if: needs.preflight.outputs.dry_run == 'false' && needs.preflight.outputs.homebrew_only == 'true'
    runs-on: ubuntu-latest
    environment: release-homebrew
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: engram-source
          ref: ${{ needs.preflight.outputs.release_sha }}
      - name: Require protected Homebrew credential
        run: test -n "${HOMEBREW_TAP_TOKEN}"
      - name: Download and verify the existing immutable GitHub Release
        run: |
          mkdir artifacts
          gh release download "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --dir artifacts
          engram-source/scripts/verify-github-release.sh \
            --tag "${RELEASE_VERSION}" \
            --sha "${RELEASE_SHA}" \
            --artifact-dir artifacts
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: aiconnai/homebrew-engram
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-engram
      - name: Update the formula from verified checksums
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          arm64_mac="$(awk '{print $1}' "artifacts/engram-${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz.sha256")"
          x86_64_mac="$(awk '{print $1}' "artifacts/engram-${RELEASE_VERSION}-x86_64-apple-darwin.tar.gz.sha256")"
          arm64_linux="$(awk '{print $1}' "artifacts/engram-${RELEASE_VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256")"
          x86_64_linux="$(awk '{print $1}' "artifacts/engram-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          cd homebrew-engram
          sed -i "s/version \".*\"/version \"${version}\"/" Formula/engram.rb
          sed -i "/aarch64-apple-darwin/{ n; s/sha256 \".*\"/sha256 \"${arm64_mac}\"/; }" Formula/engram.rb
          sed -i "/x86_64-apple-darwin/{ n; s/sha256 \".*\"/sha256 \"${x86_64_mac}\"/; }" Formula/engram.rb
          sed -i "/aarch64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${arm64_linux}\"/; }" Formula/engram.rb
          sed -i "/x86_64-unknown-linux-gnu/{ n; s/sha256 \".*\"/sha256 \"${x86_64_linux}\"/; }" Formula/engram.rb
          python3 ../engram-source/.github/scripts/ensure-pdf-worker-homebrew.py Formula/engram.rb
          git diff --check
      - name: Commit and push the sole formula change
        run: |
          set -euo pipefail
          cd homebrew-engram
          test "$(git diff --name-only | tr -d '\n')" = "Formula/engram.rb"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/engram.rb
          git commit -m "chore: update engram to ${RELEASE_VERSION}"
          git push
      - name: Verify the published Homebrew formula installs and runs
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          engram-source/scripts/verify-homebrew-release.sh \
            --version "${version}" \
            --disposable-prefix
