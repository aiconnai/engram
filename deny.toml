# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
# The libSQL-only exceptions were removed with the retired Turso backend
# (ADR-STORAGE-20260816-1). Feature-gated PDF warnings remain governed without
# global suppression in docs/security/advisory-exceptions.toml.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Use rustls instead
    { crate = "openssl", reason = "Use rustls for pure-Rust TLS without C runtime dependencies" },
    { crate = "openssl-sys", reason = "Use rustls for pure-Rust TLS without C runtime dependencies" },
    { crate = "native-tls", reason = "Use rustls for pure-Rust TLS without C runtime dependencies" },
    # Deprecated crates
    { crate = "net2", reason = "Deprecated in ecosystem; use socket2 instead" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
