  "engram-core 0.23.0 -> pdf-extract 0.12.0 -> lopdf 0.42.0 -> ttf-parser 0.25.1",
  "engram-core 0.23.0 -> lopdf 0.42.0 -> ttf-parser 0.25.1",
]
feature = "pdf optional feature only"
exposure = "Feature-gated PDF ingestion font parsing path (the pdf feature is part of the required CI feature set, not the default one); bounded by input bytes before parsing, page-tree traversal before text extraction, and extracted text bytes; not present in the default non-PDF feature graph and not globally ignored in cargo-audit or cargo-deny."
owner = "Ronaldo"
expires = 2026-12-31
remediation = "No fix reachable by a dependency update: lopdf 0.45 drops ttf-parser, but pdf-extract 0.12 pins lopdf ^0.42, so cutting it needs a product change (replace/upgrade pdf-extract or the PDF extraction path). Remove this governed warning when the PDF stack no longer depends on ttf-parser."
feature_gated = true
default_graph = false

