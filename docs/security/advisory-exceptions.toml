# Governed RustSec advisory exceptions.
#
# Each record must name the dependency path, feature exposure, owner, expiry, and
# remediation. `scripts/check-security-exceptions.py` enforces parity with
# `.cargo/audit.toml` ignores and `deny.toml` cargo-deny advisory ignores, and it
# keeps feature-gated warnings out of global ignore lists, and (task Q5) rejects any expiry
# more than 90 days ahead.
#
# Q5 re-verification (2026-10-05): every record below was re-checked against the current
# Cargo.lock with `cargo audit --no-fetch` (RustSec advisory-db commit ef6173c, 2026-10-03,
# 1290 advisories) and `cargo tree --all-features -i`, and renewed to 2026-12-31 only because no
# semver-compatible dependency update fixes it. Anything fixable by a dependency update was handed
# to Q6 (Cargo.toml/Cargo.lock) with no exception.
#
# Integration reconciliation (task INT, 2026-10-05), after Q6 landed: `cargo audit` with a freshly
# fetched database (still ef6173c, 1290 advisories) reports no vulnerability and two allowed
# warnings (RUSTSEC-2026-0192 ttf-parser, RUSTSEC-2026-0253 lru). Q6 removed from the lock:
#   - RUSTSEC-2026-0285 rustls 0.23.36 (updated to 0.23.45; never excepted)
#   - RUSTSEC-2026-0235 rkyv 0.7.46 (rust_decimal 1.43.0 drops it; record and ignores deleted)
#   - RUSTSEC-2026-0221 event-listener 5.4.1 (updated to 5.4.2; never excepted)
# The turso-only records (0049/0098/0099/0104/0258 and the unmaintained 2025-0141/2025-0134) were
# re-traced with `cargo tree --locked --all-features -i <crate>@<version>`: libsql 0.9.30 is the only
# parent; neither the default (`openai`) nor the required CI feature set contains them. The global
# cargo-audit/cargo-deny ignores stay because cargo-deny runs with `all-features = true`.

[metadata]
schema_version = 1
as_of = 2026-10-05
owner = "Ronaldo"
advisory_db_commit = "ef6173cbc5c50ec8166f9a5b28f07834144373ee"
advisory_db_date = 2026-10-03

[[exceptions]]
advisory = "RUSTSEC-2026-0049"
crate = "rustls-webpki"
versions = ["0.102.8"]
tools = ["cargo-audit:ignore", "cargo-deny:ignore"]
dependency_path = [
  "engram-core 0.23.0 -> libsql 0.9.30 -> hyper-rustls 0.25.0 -> rustls 0.22.4 -> rustls-webpki 0.102.8",
]
feature = "turso optional feature; included by cargo-deny all-features"
exposure = "Optional libSQL/Turso TLS validation path; advisory is CRL revocation handling and no Engram code enables permissive unknown-revocation policy."
owner = "Ronaldo"
expires = 2026-12-31
remediation = "No fix reachable by a dependency update: rustls 0.22.x pins rustls-webpki ^0.102 and libsql 0.9.30 (latest stable 0.9.x) pins hyper-rustls 0.25. Remove when libsql ships on rustls 0.23 (0.10.0-pre.* is pre-release only) or when the turso feature is dropped; then remove the cargo-audit and cargo-deny ignores."
feature_gated = true
default_graph = false

