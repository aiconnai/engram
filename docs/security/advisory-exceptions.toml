# Governed RustSec advisory exceptions.
#
# Each record must name the dependency path, feature exposure, owner, expiry, and
# remediation. `scripts/check-security-exceptions.py` enforces parity with
# `.cargo/audit.toml` ignores and `deny.toml` cargo-deny advisory ignores, keeps
# feature-gated warnings out of global ignore lists, and rejects any expiry more
# than 90 days ahead.
#
# Last advisory-db verification: 2026-10-05, commit ef6173c (2026-10-03,
# 1290 advisories). The retained records were checked with `cargo audit --no-fetch`
# and `cargo tree --all-features -i`, and expire on 2026-12-31 because no
# semver-compatible dependency update fixes them. A fixable advisory must be
# resolved through the dependency update task rather than an exception renewal.
#
# Turso sunset (ADR-STORAGE-20260816-1): removing libsql retires its exceptions
# for rustls-webpki 0.102.8 (0049/0098/0099/0104), rustls 0.22.4 (0346/0349),
# h2 0.3.27 (0258), bincode 1.3.3 (2025-0141), and rustls-pemfile 2.2.0
# (2025-0134), together with their cargo-audit/cargo-deny ignores. These paths
# were libSQL-only in the prior graph. Integration must verify their absence in
# the regenerated lockfile and rerun audit; this ledger is not audit evidence.
# The independent local-embedding paste exception and PDF ttf-parser warning
# remain below with their original scopes and expiry dates.

[metadata]
schema_version = 1
as_of = 2026-10-05
owner = "Ronaldo"
advisory_db_commit = "ef6173cbc5c50ec8166f9a5b28f07834144373ee"
advisory_db_date = 2026-10-03

[[exceptions]]
advisory = "RUSTSEC-2024-0436"
crate = "paste"
versions = ["1.0.15"]
tools = ["cargo-audit:ignore"]
dependency_path = [
  "engram-core 0.24.0 -> tokenizers 0.23.1 -> paste 1.0.15",
  "engram-core 0.24.0 -> tokenizers 0.23.1 -> macro_rules_attribute 0.2.2 -> paste 1.0.15",
]
feature = "onnx-embed/local-embeddings optional feature only"
exposure = "Unmaintained proc-macro dependency in optional local embedding tokenizers stack; not loaded by the default feature graph."
owner = "Ronaldo"
expires = 2026-12-31
remediation = "No replacement exists in the dependency tree (unmaintained, no patched version). Track tokenizers removal of paste or replace the local embedding tokenizer stack; remove the cargo-audit ignore once Cargo.lock no longer contains paste."
feature_gated = true
default_graph = false

[[exceptions]]
advisory = "RUSTSEC-2026-0192"
crate = "ttf-parser"
versions = ["0.25.1"]
tools = ["cargo-audit:allowed-warning"]
url = "https://github.com/harfbuzz/ttf-parser/issues/217"
dependency_path = [
  "engram-core 0.24.0 -> pdf-extract 0.12.0 -> lopdf 0.42.0 -> ttf-parser 0.25.1",
  "engram-core 0.24.0 -> lopdf 0.42.0 -> ttf-parser 0.25.1",
]
feature = "pdf optional feature only"
exposure = "Feature-gated PDF ingestion font parsing path (the pdf feature is part of the required CI feature set, not the default one); bounded by input bytes before parsing, page-tree traversal before text extraction, and extracted text bytes; not present in the default non-PDF feature graph and not globally ignored in cargo-audit or cargo-deny."
owner = "Ronaldo"
expires = 2026-12-31
remediation = "No fix reachable by a dependency update: lopdf 0.45 drops ttf-parser, but pdf-extract 0.12 pins lopdf ^0.42, so cutting it needs a product change (replace/upgrade pdf-extract or the PDF extraction path). Remove this governed warning when the PDF stack no longer depends on ttf-parser."
feature_gated = true
default_graph = false
