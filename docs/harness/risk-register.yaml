entries:

  - id: RISK-0001
    date: 2026-06-26
    status: monitoring
    description: "Associatividade de execução por etapas não detecta regressões entre etapas e pode mascarar falha de ordem de comandos"
    probability: 2
    impact: 3
    score: 6
    owner: "@team"
    mitigation: "Manter testes de integração full completos; incluir validação de ordem/timeout e revisão de output completo no fail"
    contingency: ""
    monitoring:
      - falhas repetidas em mesmas etapas
      - CI_TIMEOUT

  - id: RISK-0002
    date: 2026-10-05
    status: monitoring
    description: "Logs fora dos caminhos criticos da O1 ainda podem imprimir paths ou texto de erro em modulos legados; sync/cloud, hooks, multimodal, watcher e bin/server ja foram redigidos"
    probability: 2
    impact: 3
    score: 6
    owner: "@team"
    mitigation: "Usar observability::redact (redacted/path_label/opaque/io_class) em todo log. PR #256 (2dca9f00, mesclado no main em 2e84a594) redigiu 41 sites em sync/cloud, hooks, multimodal e watcher com testes de captura por modulo; em 2026-10-29 os 2 sites restantes em src/bin/server.rs foram redigidos."
    contingency: "Operar com RUST_LOG em nivel info e nao reter logs compartilhados ate a varredura residual"
    monitoring:
      - "novo log com %err ou path.display()"
      - "ENGRAM_LOG_ERROR_DETAIL ativo em ambiente compartilhado"

  - id: RISK-0003
    date: 2026-10-26
    status: monitoring
    description: "Regressao de autorizacao em e04d3307 em memory_create_batch e memory_ingest_fact_batch; corrigida e mesclada em origin/main (2e84a594), mantida em monitoramento ate o receipt pos-gate."
    probability: 1
    impact: 5
    score: 5
    owner: "Ronaldo (correcao: WT1)"
    mitigation: "Mesclado em origin/main via PRs #247 (f304bf51), #254 (3e6687b7) e #255 (8b1eb9ab -> 2e84a594), com testes de regressao por tool de lote e e2e gRPC; em 2026-10-29 estendido ID_SCOPED_TOOLS e ensure_memory_access para as 9 tools de lifecycle/policy por ID. Fechar apos receipt humano pos-gate."
    contingency: "Reverter ou bloquear tools de lote caso qualquer desvio de escopo apareca nos gates"
    monitoring:
      - "receipt humano pos-gate para a stack 2e84a594"
      - "novas tools de lote ou por ID sem workspace_guard"

  - id: RISK-0004
    date: 2026-10-26
    status: monitoring
    description: "Minors de autorizacao adiados do programa de outubro: cache de resultados (ledger 235), resources/subscribe (97), tool desconhecida fail-open e escalada por flag de escrita (107), e teste e2e gRPC (98)."
    probability: 1
    impact: 4
    score: 4
    owner: "Ronaldo (correcao: WT1)"
    mitigation: "Todos os itens mesclados em origin/main (2e84a594) via PRs #247, #254 e #255 (cache 15b984ab, subscribe 14f44449+f53b75a0, tool desconhecida 4d4cdc8e, escalada por flag de escrita a677c10e, e2e gRPC 83e3816c). Mantido em monitoring ate o receipt humano pos-gate."
    contingency: ""
    monitoring:
      - "receipt humano pos-gate"
      - "novo item de autorizacao no ledger"

  - id: RISK-0005
    date: 2026-10-26
    status: monitoring
    description: "merge_gate_ci.base_references() e workflow_blob() falhavam aberto se o git falhasse, e outros minors do H5 (required_jobs depende de indentacao, conjunto protegido amplo). O avaliador so aponta elegibilidade e o merge segue humano."
    probability: 1
    impact: 3
    score: 3
    owner: "@team"
    mitigation: "Em 2026-10-29 (H2), base_references(), protected_changes() e workflow_blob() passaram a falhar fechado (CiRefusal ci_base_unverifiable / ci_workflow_unverifiable) com 3 testes hermeticos em test_merge_gate.py (floor 50). Aguarda review humano independente de docs/harness/bin/*; merge segue humano."
    contingency: ""
    monitoring:
      - "review humano independente das mudancas em docs/harness/bin/merge_gate_ci.py e merge-gate.py"

  - id: RISK-0006
    date: 2026-10-26
    status: open
    description: "D8: a protecao de main nao exige review de PR e enforce_admins=false; merge humano e regra de processo, nao controle tecnico. Security Gate e Harness Contract tambem nao sao contexts required."
    probability: 3
    impact: 4
    score: 12
    owner: "Ronaldo"
    mitigation: "Decisao do owner sobre branch protection, Dependabot e secret scanning (plano de remediacao, decisao 8). Nenhuma automacao altera settings remotos."
    contingency: ""
    monitoring:
      - "merge em main sem review humano"
      - "mudanca de required_status_checks"

  - id: RISK-0007
    date: 2026-10-26
    status: deferred
    description: "ADR C4 (docs/decisions/2026-10-05-c4-descriptor-bound-sqlite-open.md) continua Proposed: a abertura de SQLite nao e atomica com a verificacao de caminho (janela TOCTOU). G1 e a Invariante 27 mitigam por caminho, nao por descritor."
    probability: 2
    impact: 4
    score: 8
    owner: "Ronaldo"
    mitigation: "Decisao do owner sobre adotar, alterar ou rejeitar o ADR (plano de remediacao, decisao 10). Ate la manter a Invariante 27 e os testes de regressao POSIX."
    contingency: ""
    monitoring:
      - "relato de perda de WAL ou de lock"
      - "mudanca em refuse_active_sqlite_artifact"

  - id: RISK-0008
    date: 2026-10-26
    status: monitoring
    description: "Exceptions governadas de advisory: 2 registros remanescentes (RUSTSEC-2026-0097 e RUSTSEC-2023-0071) vencem em 2026-12-31. Os 7 advisories de outubro foram corrigidos e mesclados no main via PR #246 (f383c837 -> 2e84a594)."
    probability: 2
    impact: 3
    score: 6
    owner: "Ronaldo (correcao: WT2)"
    mitigation: "Mesclado em origin/main via PR #246 (f383c837 -> 2e84a594): cargo audit com 0 vulnerabilidades nao governadas, cargo deny advisories/bans/licenses/sources ok, CI do main verde desde f304bf51. Acompanhar remocao das 2 excecoes governadas antes de 2026-12-31 sem renovar advisory corrigivel (GATES)."
    contingency: ""
    monitoring:
      - "vencimento de 2026-12-31"
      - "novo advisory no lock"

