    probability: 2
    impact: 4
    score: 8
    owner: "Ronaldo"
    mitigation: "Decisao do owner sobre adotar, alterar ou rejeitar o ADR (plano de remediacao, decisao 10). Ate la manter a Invariante 27 e os testes de regressao POSIX."
    contingency: ""
    monitoring:
      - "relato de perda de WAL ou de lock"
      - "mudanca em refuse_active_sqlite_artifact"

  - id: RISK-0008
    date: 2026-10-26
    status: monitoring
    description: "Excecoes governadas de advisory em docs/security/advisory-exceptions.toml: 3 registros ativos (RUSTSEC-2024-0436 paste 1.0.15 em onnx-embed opcional, RUSTSEC-2026-0192 ttf-parser 0.25.1 em pdf opcional e RUSTSEC-2026-0543 chrono 0.4.43 no grafo default via PR #281) vencem em 2026-12-31."
    probability: 2
    impact: 3
    score: 6
    owner: "Ronaldo"
    mitigation: "Advisories corrigiveis mesclados em origin/main via PRs #246 (2e84a594), #267 (rusqlite 0.41.1) e #277 (rustix 1.1.6, quinn-proto 0.11.19, quinn-udp 0.5.16); PR #281 (33992508) limitou RUSTSEC-2026-0543 (chrono) ate 2026-12-31. Plano empirico por ondas registrado em docs/harness/plans/2026-11-19-rustsec-2026-12-31-remediation-plan.md (W1 lopdf 0.47 sem ttf-parser, W2 tokenizers 1.0 sem paste, W3A/W3B/W3C chrono -> jiff + bloqueio transitivo arrow-array) e ancora metadata.as_of sincronizada em check-security-exceptions.py."
    contingency: ""
    monitoring:
      - "vencimento de 2026-12-31 nas 3 excecoes governadas"
      - "novo advisory no lock"

